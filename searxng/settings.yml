# SearXNG settings.
# Full list of options: https://docs.searxng.org/admin/settings/
# Values here override SearXNG's defaults. The secret key is read from the
# SEARXNG_SECRET environment variable (set in .env), not from this file.

use_default_settings: true

general:
  instance_name: "My Private Search"
  debug: false
  enable_metrics: true

search:
  # 0 = off, 1 = moderate, 2 = strict (recommended for kids)
  safe_search: 2
  autocomplete: "duckduckgo"
  default_lang: "auto"

server:
  # Change the HTTP method to GET so the browser Back button works properly.
  method: "GET"
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080
